<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBF8F5" />
    <title>Hors ligne · Centrium</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #fbf8f5;
        color: #1f1a17;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 28px 24px;
        border: 1px solid #ebe3dc;
        border-radius: 20px;
        background: #ffffff;
        text-align: center;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: #9d4432;
      }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #6f645c; }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: #b8553f;
        color: #ffffff;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Vous êtes hors ligne</h1>
      <p>Centrium a besoin d’une connexion pour afficher vos données à jour. Rien n’est conservé sur l’appareil : reconnectez-vous au réseau puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
