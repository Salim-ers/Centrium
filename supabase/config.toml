project_id = "quadcore-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

# Templates email custom (versionnés dans supabase/templates/).
# Pour le PROD (hosted Supabase) : ces fichiers doivent être collés
# manuellement dans Dashboard → Authentication → Email Templates, OU
# pushés via Management API (voir scripts/push-auth-templates.sh).
[auth.email.template.invite]
subject = "Invitation à rejoindre Centrium"
content_path = "./templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirmez votre adresse email"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisation de votre mot de passe"
content_path = "./templates/recovery.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion Centrium"
content_path = "./templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse email"
content_path = "./templates/email_change.html"

[analytics]
enabled = false

