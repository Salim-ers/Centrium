version: 2

updates:
  # Updates npm hebdomadaires
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    # Groupe les MAJ mineures pour éviter le bruit
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-minor:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    # Ignore les MAJ majeures de certaines libs (breaking changes risqués)
    ignore:
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@supabase/*'
        update-types: ['version-update:semver-major']

  # Updates GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 3
    labels:
      - 'github-actions'
      - 'automated'
    commit-message:
      prefix: 'chore(ci)'
