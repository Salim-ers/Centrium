name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents sur la même branche pour économiser
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Quality gate : type-check + lint
  # Bloque le merge si fail.
  # ────────────────────────────────────────────────────────────────────
  quality:
    name: Type check + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

  # ────────────────────────────────────────────────────────────────────
  # Tests unitaires (Vitest)
  # ────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test
        env:
          # Mock minimal pour les tests unitaires (les vrais secrets ne sont
          # JAMAIS exposés dans la CI publique)
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

  # ────────────────────────────────────────────────────────────────────
  # Build de production
  # Garantit que le build Vercel passera avant le merge.
  # ────────────────────────────────────────────────────────────────────
  build:
    name: Build production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          # Stubs pour permettre au build de passer en CI sans secrets prod
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://centrium-platform.com
          # Sentry désactivé en CI build (pas de DSN, pas d'upload source maps)
          SENTRY_DSN: ''
          NEXT_PUBLIC_SENTRY_DSN: ''

  # ────────────────────────────────────────────────────────────────────
  # Audit sécurité npm
  # Bloque sur niveau "high" et "critical" uniquement.
  # ────────────────────────────────────────────────────────────────────
  security-audit:
    name: npm audit (high+critical)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Permet à ce job d'échouer sans bloquer le merge — le but est d'alerter,
    # pas de bloquer le développement si une dep transitive a un CVE.
    # Bascule en `false` quand toutes les CVE actuelles sont triées.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high

  # ────────────────────────────────────────────────────────────────────
  # Tests E2E isolation cross-tenant
  # Skip si les secrets de seed ne sont pas en place (initial)
  # ────────────────────────────────────────────────────────────────────
  e2e-isolation:
    name: E2E isolation cross-tenant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ false }}  # à activer quand les secrets E2E_* sont posés en repo settings
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E isolation tests
        run: npx playwright test tests/e2e/multi-tenant-isolation.spec.ts
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          TEST_ORG_A_ADMIN_EMAIL: ${{ secrets.E2E_ORG_A_EMAIL }}
          TEST_ORG_A_ADMIN_PASSWORD: ${{ secrets.E2E_ORG_A_PASSWORD }}
          TEST_ORG_B_ADMIN_EMAIL: ${{ secrets.E2E_ORG_B_EMAIL }}
          TEST_ORG_B_ADMIN_PASSWORD: ${{ secrets.E2E_ORG_B_PASSWORD }}
          TEST_ORG_A_ID: ${{ secrets.E2E_ORG_A_ID }}
          TEST_ORG_B_ID: ${{ secrets.E2E_ORG_B_ID }}
